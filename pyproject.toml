[project]
name = "telecom-churn-mlops"
version = "0.1.0"
description = "Enterprise Telecom Churn & Retention Scoring Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "mlflow>=2.15.1",
    "psycopg2-binary>=2.9.9",
    "loguru>=0.7.2",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "pre-commit>=3.8.0",
    "moto[s3]>=5.0.12",
    "pandas-stubs>=2.2.2.240807",
    "types-boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["churn_engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "evidently.*",
    "mlflow.*",
    "sklearn.*",
    "lightgbm.*",
    "onnxruntime.*",
    "skl2onnx.*",
    "s3fs.*",
    "moto.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests",
    "tests.*",
]
disallow_untyped_decorators = false
